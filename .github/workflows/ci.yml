name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Start PostgreSQL and LocalStack
        run: docker compose up -d --wait
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Check documentation formatting
        run: >-
          bunx prettier --check README.md ARCHITECTURE.md docs/README.md
          docs/specs/01-persistence-and-concurrency.md
          docs/specs/02-api-and-idempotency.md
          docs/specs/04-operations-and-verification.md
          docs/plans/implementation-roadmap.md docs/api/openapi.yaml
          .github/workflows/ci.yml
      - name: Type-check
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Test
        run: bun test
      - name: Stop dependencies
        if: always()
        run: docker compose down -v
